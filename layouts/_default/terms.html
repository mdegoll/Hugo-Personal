{{- define "main" }}
<div class="page-flow">
  <header class="page-hero">
    <h1>{{ .Title }}</h1>
  </header>
  <section class="page-section">
    <h2>All {{ .Title | lower }}</h2>
    <ul class="panel-list">
      {{- range .Data.Terms.Alphabetical }}
      <li>
        <a class="tag-chip" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
        <span class="panel-meta">{{ .Count }}</span>
      </li>
      {{- end }}
    </ul>
  </section>
</div>
{{- end }}
