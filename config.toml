baseurl = "https://www.degoll.net/"
languageCode = "en-us"
title = "Michael DeGoll"
theme = "PaperMod"
copyright = "Michael DeGoll"

[pagination]
  pagerSize = 10

[services]
  [services.googleAnalytics]
    id = "G-DX23EZT920"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "Purpose-built software for teams outgrowing the platforms they rent."
  mainSections = ["playbooks", "post"]
  defaultTheme = "light"
  disableThemeToggle = true
  disableScrollToTop = true
  ShowBreadCrumbs = false
  ShowPostNavLinks = false
  ShowReadingTime = false
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = false
  disableSpecial1stPost = true

[params.assets]
  favicon = "/images/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/safari-pinned-tab.svg"
  theme_color = "#ffffff"

[[menu.main]]
  name = "Playbooks"
  url = "/playbooks/"
  weight = 1

[[menu.main]]
  name = "Writing"
  url = "/post/"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3
